name: Build Trove guest image for OCI system containers

# Builds the Trove guest image for one OCI system container platform
# (guest/oci/Containerfile on the platform layer pinned in
# guest/<platform>/pins.env, with guest/<platform>/files) and pushes it to
# ghcr.io/fivetime/trove/guest-<platform>. Publishing to Glance is not done
# here: Incus images go through the Incus driver's publishing tool on a
# trusted host (openstack-incus doc/source/oci_system_images.rst), Kata
# images are exported as the OCI layout archive nova-kata takes
# (guest/kata/oci-archive.py), each after the driver's gate.
#
# The guest agent inside is the trove commit this run checked out, the same
# way the KVM guest image carries it.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'The OCI system container platform'
        type: choice
        options: [incus, kata]
        default: incus
      trove_ref:
        description: 'Branch or commit of fivetime/openstack-trove'
        default: 'master'
      force:
        description: 'Build even if ghcr.io already has this trove commit on this base'
        type: boolean
        default: false
      push:
        description: 'Push to ghcr.io'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: trove-guest-${{ inputs.platform }}-image
  cancel-in-progress: false

env:
  TROVE_REF: ${{ inputs.trove_ref || 'master' }}
  PLATFORM: ${{ inputs.platform }}
  IMAGE: ghcr.io/fivetime/trove/guest-${{ inputs.platform }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: images

      - name: Check out trove
        uses: actions/checkout@v4
        with:
          repository: fivetime/openstack-trove
          ref: ${{ env.TROVE_REF }}
          path: trove
          # pbr derives the package version from tags; without history the
          # guest agent would be built as 0.0.1.devN.
          fetch-depth: 0

      - name: Resolve the inputs
        id: rev
        run: |
          set -o pipefail
          sha=$(git -C trove rev-parse HEAD)
          . "images/guest/$PLATFORM/pins.env"
          snapshot=$(docker buildx imagetools inspect "$BASE_IMAGE" \
            --format '{{ index .Image.Config.Labels "io.fivetime.oci-system.apt-snapshot" }}')
          test -n "$snapshot"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=${sha:0:7}-$snapshot" >> "$GITHUB_OUTPUT"
          echo "trove $sha on $BASE_IMAGE (snapshot $snapshot)"

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Decide whether to build
        id: check
        env:
          TAG: ${{ steps.rev.outputs.tag }}
          FORCE: ${{ inputs.force || false }}
        run: |
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1 && [[ "$FORCE" != "true" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "ghcr.io already has $IMAGE:$TAG, skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.build == 'true'
        env:
          TAG: ${{ steps.rev.outputs.tag }}
        run: |
          # The context is the workspace: the Containerfile copies ./trove.
          docker build -f images/guest/oci/Containerfile \
            --build-arg BASE_IMAGE="${{ steps.rev.outputs.base }}" \
            --build-arg TROVE_COMMIT="${{ steps.rev.outputs.sha }}" \
            --build-arg PLATFORM="$PLATFORM" \
            --build-arg FILES="images/guest/$PLATFORM/files" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.base.name=${{ steps.rev.outputs.base }}" \
            --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" .

      - name: Verify the image
        if: steps.check.outputs.build == 'true'
        env:
          TAG: ${{ steps.rev.outputs.tag }}
        run: |
          # What the drivers check for a derived image, and what the guest
          # needs: the base's runtime configuration (PID 1, user, working
          # directory, environment, stop signal) unchanged, the agent at
          # this run's commit, Docker and the agent's units enabled, no
          # machine identity or host keys; then the platform's own checks
          # (guest/<platform>/files/verify).
          fmt='{{ json .Config.Cmd }} {{ json .Config.Entrypoint }} {{ .Config.User }} {{ .Config.WorkingDir }} {{ json .Config.Env }} {{ .Config.StopSignal }}'
          # The build pulled the base by digest without keeping a tag.
          docker pull -q "${{ steps.rev.outputs.base }}" >/dev/null
          base=$(docker image inspect "${{ steps.rev.outputs.base }}" -f "$fmt")
          cfg=$(docker image inspect "$IMAGE:$TAG" -f "$fmt")
          echo "base:  $base"
          echo "image: $cfg"
          test "$cfg" = "$base"
          docker run --rm --entrypoint sh "$IMAGE:$TAG" -c '
            set -e
            test "$(cat /usr/share/oci-system/trove-guest-commit)" = "'"${{ steps.rev.outputs.sha }}"'"
            test "$(cat /opt/guest-agent/.commit)" = "'"${{ steps.rev.outputs.sha }}"'"
            test -x /opt/guest-agent-venv/bin/trove-guestagent
            test -x /opt/guest-agent-venv/bin/trove-docker-plugin
            command -v dockerd containerd runc
            for u in docker.service containerd.service guest-agent.service docker-hostnic.socket; do
              systemctl is-enabled "$u"
            done
            test "$(systemctl is-enabled trove-image-loader.service)" = disabled
            id ubuntu
            test -f /usr/lib/tmpfiles.d/oci-system-resolv.conf
            test "$(cat /etc/machine-id)" = uninitialized
            ! ls /etc/ssh/ssh_host_* 2>/dev/null
          '
          docker run --rm -i --entrypoint sh "$IMAGE:$TAG" -s < "images/guest/$PLATFORM/files/verify"

      - name: Push
        if: steps.check.outputs.build == 'true' && inputs.push
        env:
          TAG: ${{ steps.rev.outputs.tag }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{ .Manifest.Digest }}')
          {
            echo "Pushed $IMAGE:$TAG (also :latest) from trove ${{ steps.rev.outputs.sha }} on ${{ steps.rev.outputs.base }}"
            echo
            echo "Manifest digest: $digest"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
